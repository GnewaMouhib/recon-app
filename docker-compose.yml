services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pentestrecon_app
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: pentestrecon
      DB_USERNAME: pentest
      DB_PASSWORD: pentest_password
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: pentestrecon_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pentestrecon
      MYSQL_USER: pentest
      MYSQL_PASSWORD: pentest_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: