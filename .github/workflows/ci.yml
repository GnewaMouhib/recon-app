name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test-and-audit:
    name: Tests, Audits & SAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Composer & NPM Audits
      - name: Validate Composer
        run: composer validate --strict

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Composer Security Audit
        run: composer audit

      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm audit --audit-level=high
          npm run build

      # 2. Automated Tests (using SQLite memory)
      - name: Run Laravel Unit & Feature Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test || true

      # 3. Secret Scanning (Gitleaks)
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 4. SAST (Semgrep)
      - name: Run Semgrep SAST
        run: |
          python3 -m pip install semgrep
          semgrep scan --config auto app routes --error

      # 5. Dependency Scanning (Trivy)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '1'